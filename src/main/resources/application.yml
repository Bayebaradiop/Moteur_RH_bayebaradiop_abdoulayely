spring:
  application:
    name: moteur-rh
  jackson:
    default-property-inclusion: non_null

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5436/moteur_rh}
    username: ${DATABASE_USER:moteur_rh}
    password: ${DATABASE_PASSWORD:moteur_rh}

  jpa:
    hibernate:
      # Le schema est gere par Flyway : Hibernate se contente de le verifier
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8090
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.company.hrsettlement: INFO
