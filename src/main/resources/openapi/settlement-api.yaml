openapi: 3.0.3

# =============================================================================
# Contrat de l'API - SOURCE DE VERITE (approche API First).
# Ce fichier est ecrit AVANT les controleurs : l'implementation doit s'y conformer.
# =============================================================================

info:
  title: Moteur RH - Solde de tout compte
  description: |
    API de calcul du solde de tout compte d'un employe.

    Le moteur calcule l'indemnite de conges non pris, la prime d'anciennete,
    la penalite de preavis, le montant brut, l'impot puis le montant net.
    Un audit de l'inspection du travail est declenche au-dela d'un seuil de net.
  version: 1.0.0
  contact:
    name: Equipe RH
    email: rh@company.com

servers:
  - url: http://localhost:8080
    description: Environnement local

tags:
  - name: Settlements
    description: Calcul du solde de tout compte

paths:
  /api/v1/settlements:
    post:
      tags: [ Settlements ]
      summary: Calcule le solde de tout compte d'un employe
      description: |
        Recoit les informations de depart d'un employe et retourne le detail du
        solde de tout compte. Le montant net peut etre negatif lorsque la penalite
        de preavis depasse les indemnites dues.
      operationId: calculateSettlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementRequest'
            examples:
              retraite:
                summary: Depart a la retraite avec conges restants
                value:
                  employeeId: "EMP-001"
                  hireDate: "2010-01-01"
                  departureDate: "2026-01-01"
                  departureReason: "RETIREMENT"
                  baseSalary: 1000000
                  remainingLeaveDays: 10
                  noticeRespected: true
              demission:
                summary: Demission sans preavis respecte
                value:
                  employeeId: "EMP-002"
                  hireDate: "2022-01-01"
                  departureDate: "2026-01-01"
                  departureReason: "RESIGNATION"
                  baseSalary: 500000
                  remainingLeaveDays: 2
                  noticeRespected: false
      responses:
        '200':
          description: Solde de tout compte calcule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementResponse'
        '400':
          description: |
            Requete invalide : contrat non respecte (Bean Validation) ou regle
            metier violee (dates incoherentes, salaire nul, conges negatifs).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-01-01T10:15:30"
                status: 400
                error: "Bad Request"
                message: "La date de depart doit etre posterieure a la date d'embauche"
                path: "/api/v1/settlements"
        '500':
          description: Erreur interne inattendue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:

    SettlementRequest:
      type: object
      description: Informations de depart d'un employe.
      required:
        - employeeId
        - hireDate
        - departureDate
        - departureReason
        - baseSalary
        - remainingLeaveDays
        - noticeRespected
      properties:
        employeeId:
          type: string
          description: Identifiant de l'employe
          example: "EMP-001"
        hireDate:
          type: string
          format: date
          description: Date d'embauche (passee)
          example: "2010-01-01"
        departureDate:
          type: string
          format: date
          description: Date de depart, strictement posterieure a la date d'embauche
          example: "2026-01-01"
        departureReason:
          $ref: '#/components/schemas/DepartureReason'
        baseSalary:
          type: number
          format: double
          description: Salaire mensuel de base en XOF, strictement positif
          example: 1000000
        remainingLeaveDays:
          type: integer
          description: Nombre de jours de conges non pris
          minimum: 0
          example: 10
        noticeRespected:
          type: boolean
          description: Indique si le preavis a ete respecte
          example: true

    SettlementResponse:
      type: object
      description: Detail du solde de tout compte.
      required:
        - employeeId
        - leaveCompensation
        - seniorityBonus
        - noticePenalty
        - grossAmount
        - taxAmount
        - netAmount
        - auditTriggered
      properties:
        employeeId:
          type: string
          example: "EMP-001"
        leaveCompensation:
          type: number
          description: Indemnite de conges non pris
          example: 476190.00
        seniorityBonus:
          type: number
          description: Prime d'anciennete (0 si non eligible)
          example: 2150000.00
        noticePenalty:
          type: number
          description: Penalite de preavis (0 si non applicable)
          example: 0.00
        grossAmount:
          type: number
          description: Montant brut, potentiellement negatif
          example: 2626190.00
        taxAmount:
          type: number
          description: Impot calcule par l'administration fiscale
          example: 95238.00
        netAmount:
          type: number
          description: Montant net verse a l'employe
          example: 2530952.00
        auditTriggered:
          type: boolean
          description: Vrai si l'inspection du travail a ete notifiee
          example: false

    DepartureReason:
      type: string
      description: Motif du depart de l'employe.
      enum:
        - RESIGNATION
        - RETIREMENT
        - ECONOMIC_DISMISSAL
        - SERIOUS_MISCONDUCT
      example: RETIREMENT

    ErrorResponse:
      type: object
      description: Format d'erreur uniforme de l'API.
      required: [ timestamp, status, error, message, path ]
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-01-01T10:15:30"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Le salaire de base doit etre strictement positif"
        path:
          type: string
          example: "/api/v1/settlements"
