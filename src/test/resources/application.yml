# Configuration de test : base en memoire.
#
# La suite reste ainsi executable sans Docker ni PostgreSQL. Le mode PostgreSQL de
# H2 conserve une syntaxe proche de la base de production ; le schema est derive des
# entites, Flyway restant reserve a l'environnement reel.

spring:
  datasource:
    url: jdbc:h2:mem:moteur_rh;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false
